services:
  - type: web
    name: healthcare-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["https://healthcare-frontend.vercel.app","http://localhost:5173"]'

databases:
  - name: healthcare-db
    plan: free
    databaseName: healthcare
    user: healthadmin
